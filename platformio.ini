; RaceWifi - Waveshare ESP32-S3-LCD-1.47B
; Version fijada: pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 sobre ESP-IDF 5.5.5.

[platformio]
src_dir = RaceWifi
default_envs = lcd147b

[env:lcd147b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; ESP32-S3R8 (8 MB PSRAM octal) + flash W25Q128 de 16 MB (quad)
board = esp32-s3-devkitc1-n16r8
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wno-missing-field-initializers
monitor_speed = 115200
monitor_filters = time
upload_speed = 921600
